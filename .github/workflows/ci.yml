name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nearkart
          POSTGRES_USER: nearkart
          POSTGRES_PASSWORD: nearkart_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nearkart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_PASSWORD: nearkart_test
      JWT_SECRET: ci-only-secret-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B verify
      - run: ./mvnw -B spring-boot:start
      - run: curl --fail --retry 10 --retry-delay 2 http://localhost:8080/actuator/health
      - if: always()
        run: ./mvnw -B spring-boot:stop

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
